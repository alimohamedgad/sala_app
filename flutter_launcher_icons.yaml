# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/dd_perfume_logo.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/dd_perfume_logo.png"
  # تقليل الـ inset ليكون متوازن (30 بدلاً من 60) لضمان ظهور الأيقونة بوضوح
  adaptive_icon_foreground_inset: 30
  ios: true
  remove_alpha_ios: true
